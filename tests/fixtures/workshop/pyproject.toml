[project]
name = "workshop"
version = "0.1.0"
description = "A channel and a runtime for an agent to stand up on a real node in server-agent's tests"
requires-python = ">=3.15"
dependencies = [
    "bazaar-contrib-audit~=0.3.0rc20",
    "bazaar-contrib-channel~=0.3.0rc20",
    "bazaar-contrib-harness~=0.3.0rc19",
    "pydantic>=2.12.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
workshop-channel-builder = "workshop:channel_builder"
workshop-runtime-builder = "workshop:runtime_builder"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
