{# the activity: the sections this module and others put there, each in its own frame; the main column and the side one, one above the other on a phone #}
<div class="sections">
  {% for column in ("main", "side") %}
  <div class="column {{ column }}">
    {% for section in sections if section.column == column %}
    <iframe class="section{% if not section.narrow %} wide{% endif %}" src="{{ section.src }}/{{ short }}" data-fit title="{{ section.key }}"></iframe>
    {% endfor %}
  </div>
  {% endfor %}
</div>
